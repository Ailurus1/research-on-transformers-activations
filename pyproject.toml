[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-on-transformers-activations"

version = "0.1.0"

description = "Research on transformers activations"

readme = "README.md"

requires-python = ">=3.11"

dependencies = [
  "acta @ git+https://github.com/Ailurus1/acta.git",
  "transformers>=4.40.0",
  "datasets>=2.19.0",
  "evaluate>=0.4.0",
  "accelerate>=0.30.0",
  "scikit-learn>=1.4.0",
  "sacrebleu>=2.4.0",
  "sentencepiece>=0.2.0",
  "tqdm>=4.66.0",
  "torchvision>=0.18.0",
  "torchaudio>=2.3.0",
  "pre-commit"
]

[tool.setuptools.packages.find]
exclude = ["outputs"]
